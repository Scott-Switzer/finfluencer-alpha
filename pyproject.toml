[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finfluencer-alpha"
version = "0.1.0"
description = "MVP research pipeline for cross-platform finfluencer stock recommendation discovery."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pydantic>=2.6.0",
  "python-dotenv>=1.0.1",
  "requests>=2.31.0",
  "rich>=13.7.0",
  "scikit-learn>=1.4.0",
  "scipy>=1.12.0",
  "statsmodels>=0.14.0",
  "typer>=0.12.0",
  "yfinance>=0.2.40,<0.3.0",
  "youtube-transcript-api>=1.2.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
finfluencer-alpha = "finfluencer_alpha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finfluencer_alpha = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
